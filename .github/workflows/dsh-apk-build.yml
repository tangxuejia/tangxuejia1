name: DSH Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "deepseek-harness-pura-x-mobile-v0.1.0-source.zip"
      - ".github/workflows/dsh-apk-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source package
        run: |
          set -euo pipefail
          rm -rf prototype/imported prototype/extracted
          mkdir -p prototype/extracted
          unzip -q deepseek-harness-pura-x-mobile-v0.1.0-source.zip -d prototype/extracted
          CMAKE_FILE="$(find prototype/extracted -type f -path '*/app/src/main/cpp/CMakeLists.txt' -print -quit)"
          test -n "$CMAKE_FILE"
          SOURCE_ROOT="${CMAKE_FILE%/app/src/main/cpp/CMakeLists.txt}"
          mv "$SOURCE_ROOT" prototype/imported
          test -f prototype/imported/app/src/main/cpp/CMakeLists.txt
      - name: Apply Android 16 KB page-size linker guard
        working-directory: prototype/imported
        run: |
          set -euo pipefail
          CMAKE_FILE="app/src/main/cpp/CMakeLists.txt"
          if ! grep -q "max-page-size=16384" "$CMAKE_FILE"; then
            printf '\ntarget_link_options(dsh_bridge PRIVATE "-Wl,-z,max-page-size=16384")\n' >> "$CMAKE_FILE"
          fi
          grep -n "max-page-size=16384" "$CMAKE_FILE"
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3 gcc-multilib g++-multilib rsync zip unzip ninja-build cmake
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;24.0.8215888"
      - uses: actions/checkout@v4
        with:
          repository: ybaelli/nodejs-mobile
          ref: 4608d3c670cf37b383dbe631de4992cf23da46e0
          path: prototype/imported/.deps/nodejs-mobile
      - name: Patch Node mobile ncrypto build compatibility
        working-directory: prototype/imported/.deps/nodejs-mobile
        run: |
          set -euo pipefail
          if ! grep -qxF '#include <vector>' deps/ncrypto/ncrypto.cc; then
            sed -i '1i#include <vector>' deps/ncrypto/ncrypto.cc
          fi
          grep -nF '#include <vector>' deps/ncrypto/ncrypto.cc
      - name: Pin Node mobile host compiler to NDK libc++
        working-directory: prototype/imported/.deps/nodejs-mobile
        run: |
          set -euo pipefail
          NDK_CLANG="$ANDROID_HOME/ndk/24.0.8215888/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > host-clang++ <<EOF
          #!/usr/bin/env bash
          exec "$NDK_CLANG/clang++" -stdlib=libc++ "\$@"
          EOF
          chmod +x host-clang++
          sed -i "s#^os.environ\\['CC_host'\\].*#os.environ['CC_host'] = '$NDK_CLANG/clang'#" android_configure.py
          sed -i "s#^os.environ\\['CXX_host'\\].*#os.environ['CXX_host'] = '$PWD/host-clang++'#" android_configure.py
          grep -nE "CC_host|CXX_host" android_configure.py
      - name: Build embedded Node arm64
        working-directory: prototype/imported/.deps/nodejs-mobile
        run: ./tools/android_build.sh "$ANDROID_HOME/ndk/24.0.8215888" 28 arm64
      - name: Install Node mobile artifacts
        working-directory: prototype/imported
        run: ./scripts/install-node-mobile-artifacts.sh .deps/nodejs-mobile
      - uses: actions/setup-node@v4
        with:
          node-version: "24.5.0"
      - name: Package and verify Harness Runtime
        working-directory: prototype/imported
        env:
          NPM_CONFIG_CACHE: /tmp/dsh-npm-cache
          NPM_CONFIG_FETCH_TIMEOUT: "120000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_PREFER_OFFLINE: "false"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NPM_CONFIG_PROGRESS: "false"
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        run: |
          set -euo pipefail
          ROOT="$PWD"
          STAGE="$ROOT/build/runtime"
          ASSET="$ROOT/app/src/main/assets/dsh-runtime.zip"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cat > "$STAGE/package.json" <<'EOF'
          {
            "private": true,
            "name": "deepseek-harness-mobile-runtime",
            "version": "0.1.0"
          }
          EOF
          cd "$STAGE"
          npm install --omit=dev --no-audit --no-fund --ignore-scripts --legacy-peer-deps --no-package-lock \
            @deepseek-ai/dsh@0.1.0-rc.7 \
            @deepseek-ai/dsh-bash-local@0.1.0-rc.7 \
            @deepseek-ai/dsh-shell@0.1.0-rc.7 \
            @deepseek-ai/dsh-timeout@0.1.0-rc.7 \
            @deepseek-ai/dsh-settings@0.1.0-rc.7 \
            @deepseek-ai/dsh-invariants@0.1.0-rc.7 \
            @deepseek-ai/dsh-sandbox@0.1.0-rc.7 \
            @deepseek-ai/dsh-sandbox-policy@0.1.0-rc.7
          cd "$ROOT"
          node scripts/prepare-runtime.mjs "$STAGE"
          node scripts/verify-runtime.mjs "$STAGE"
          rm -f "$ASSET"
          cd "$STAGE"
          zip -q -r -9 "$ASSET" .
          test -s "$ASSET"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: prototype/imported
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK payload
        working-directory: prototype/imported
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/arm64-v8a/libnode.so|lib/arm64-v8a/libdsh_bridge.so|assets/dsh-runtime.zip"
      - name: Generate release manifest and checksum
        working-directory: prototype/imported
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          cat > app/build/outputs/apk/debug/dsh-build-manifest.txt <<EOF
          app_version=0.1.0
          node_version=24.5.0
          harness_version=0.1.0-rc.7
          architecture=arm64-v8a
          host=127.0.0.1
          port=3080
          git_sha=${GITHUB_SHA}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-pura-x-debug-apk
          path: |
            prototype/imported/app/build/outputs/apk/debug/app-debug.apk
            prototype/imported/app/build/outputs/apk/debug/app-debug.apk.sha256
            prototype/imported/app/build/outputs/apk/debug/dsh-build-manifest.txt
          if-no-files-found: error
          retention-days: 30
