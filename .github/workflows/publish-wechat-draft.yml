name: Publish WeChat Draft (Legacy Manual)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'test.json'
      - 'publisher.mjs'
      - 'v3-draft.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-wechat-draft.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate V3 article
        run: node v3-draft.mjs

      - name: Validate article
        run: node publisher.mjs generated-v3.json --dry-run

      - name: Publish draft
        env:
          WECHAT_APP_ID: wxd2cc750949b71b6e
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_THUMB_MEDIA_ID: ${{ secrets.WECHAT_THUMB_MEDIA_ID }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
        run: node publisher.mjs generated-v3.json
