name: Publish WeChat Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate article
        run: node publisher.mjs test.json --dry-run

      - name: Publish draft
        env:
          WECHAT_APP_ID: wxd2cc750949b71b6e
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_THUMB_MEDIA_ID: ${{ secrets.WECHAT_THUMB_MEDIA_ID }}
        run: node publisher.mjs test.json
