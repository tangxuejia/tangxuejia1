name: WeChat News Autowriter V3.5 Batch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
    paths:
      - "wechat-news/batch_writer.mjs"
      - "wechat-news/prepare_publish.mjs"
      - "wechat-news/content_qc.mjs"
      - "wechat-news/output/run-once.txt"
      - ".github/workflows/wechat-news-autowriter.yml"

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run identity
        run: |
          echo "workflow=wechat-news-v3.5-batch"
          echo "commit=$GITHUB_SHA"
          date -u
      - name: Validate Agnes configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e
          if [ -z "$AGNES_API_KEY" ]; then echo "AGNES_API_KEY is missing or unavailable to this workflow"; exit 1; fi
          echo "AGNES_API_KEY is present"
      - name: Syntax check batch writer
        run: node --check wechat-news/batch_writer.mjs
      - name: Generate exactly 3 Tagalog articles
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ vars.AGNES_BASE_URL || 'https://apihub.agnes-ai.com' }}
          AGNES_TEXT_MODEL: ${{ vars.AGNES_TEXT_MODEL || 'agnes-2.5-flash' }}
          AGNES_IMAGE_MODEL: ${{ vars.AGNES_IMAGE_MODEL || 'agnes-image-2.1-flash' }}
        run: node wechat-news/batch_writer.mjs
      - name: QC all 3 articles
        run: |
          set -e
          test "$(node -e "console.log(require('./wechat-news/output/batch-manifest.json').count)")" = "3"
          for f in wechat-news/output/daily-1.json wechat-news/output/daily-2.json wechat-news/output/daily-3.json; do
            node wechat-news/prepare_publish.mjs "$f"
            node -e "import('./wechat-news/content_qc.mjs').then(async m=>{const a=JSON.parse(require('fs').readFileSync(process.argv[1])); const r=m.qcArticle(a); if(!r.title||!r.structure||!Array.isArray(a.inline_images)||a.inline_images.length<3||!a.content.includes('{{image:cover}}')||!a.content.includes('{{image:action}}')||!a.content.includes('{{image:language}}')) process.exit(1); console.log(process.argv[1],r)})" "$f"
          done
      - name: Publish 3 drafts to WeChat
        env:
          WECHAT_APP_ID: wxd2cc750949b71b6e
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
        run: |
          set -e
          node publisher.mjs wechat-news/output/batch-manifest.json
