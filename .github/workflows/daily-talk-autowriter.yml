name: Daily Talk Tech Autowriter

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "tech-news/run-once.txt"
  schedule:
    - cron: "17 0 * * *"
    - cron: "43 2 * * *"
    - cron: "11 4 * * *"
    - cron: "37 6 * * *"
    - cron: "23 9 * * *"
    - cron: "49 11 * * *"
    - cron: "7 13 * * *"
    - cron: "53 14 * * *"

permissions:
  contents: write

concurrency:
  group: daily-talk-publish
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Decide slot
        id: gate
        env:
          TECH_SCHEDULE: ${{ github.event.schedule }}
          FORCE_PUBLISH: ${{ github.event_name != 'schedule' }}
        run: node tech-news/slot_guard.mjs

      - name: Generate and publish 8 Daily Talk articles
        if: steps.gate.outputs.should_publish == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ vars.AGNES_BASE_URL || 'https://apihub.agnes-ai.com' }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_DAILY_TALK_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_DAILY_TALK_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          TECH_MANILA_DATE: ${{ steps.gate.outputs.manila_date }}
        run: |
          set -uo pipefail
          npm ci
          publish_with_retry() {
            for publish_attempt in 1 2 3; do
              if node publisher.mjs tech-news/output/daily.json; then return 0; fi
              echo "publisher_retry=$publish_attempt"
              sleep $((publish_attempt * 20))
            done
            echo "publisher_failed_after_3_attempts"
            return 1
          }
          success_count=0
          failed_count=0
          for i in 1 2 3 4 5 6 7 8; do
            case "$i" in
              1) lane="国产手机与鸿蒙" ;;
              2) lane="国产芯片与硬件" ;;
              3) lane="国产科技与智能设备" ;;
              4) lane="数码消费与实用提醒" ;;
              5) lane="AI与大模型" ;;
              6) lane="国际人工智能" ;;
              7) lane="国际科技公司" ;;
              8) lane="当天科技热点观察" ;;
            esac
            article_ok=false
            for attempt in 1 2 3; do
              echo "=== Daily Talk article $i/8 attempt $attempt: $lane ==="
              rm -f tech-news/output/daily.json
              if TECH_ARTICLE_INDEX="$i" TECH_EDITORIAL_LANE="$lane" node tech-news/auto_writer.mjs                 && test -s tech-news/output/daily.json                 && node publisher.mjs tech-news/output/daily.json --dry-run                 && publish_with_retry; then
                article_ok=true
                success_count=$((success_count + 1))
                echo "article_status=$i success"
                break
              fi
              echo "article_status=$i retry=$attempt"
              sleep $((attempt * 15))
            done
            if [ "$article_ok" != "true" ]; then
              failed_count=$((failed_count + 1))
              echo "article_status=$i failed_after_3_attempts"
            fi
          done
          echo "daily_talk_success_count=$success_count"
          echo "daily_talk_failed_count=$failed_count"
          echo "daily_talk_batch_finished=true"

      - name: Record workflow result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          node tech-news/record_status.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-news/status/last-run.json
          git diff --cached --quiet || git commit -m "chore: record Daily Talk run status" || true
          git push origin HEAD:master || true
